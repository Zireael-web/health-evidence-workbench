name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra documents
      - name: Tests
        run: uv run pytest
      - name: Runtime manifest is current
        run: uv run python scripts/update-runtime-manifest --check
