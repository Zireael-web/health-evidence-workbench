name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    env:
      # The sandboxed PDF worker needs a standalone interpreter; framework builds
      # of Python re-exec through Python.app, which the seatbelt profile denies.
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --extra documents
      - name: Tests
        run: uv run pytest
      - name: Runtime manifest is current
        run: uv run python scripts/update-runtime-manifest --check
