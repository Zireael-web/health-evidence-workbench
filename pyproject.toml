[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "health-analyzer"
version = "0.2.0"
description = "Local-first, evidence-grounded human science workbench for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Local developer" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0,<7",
  "pytest>=8.3,<10",
]
mcp = ["mcp>=2,<3"]
documents = ["pypdf>=6.15,<7"]

[project.scripts]
health-analyzer = "health_analyzer.cli:main"
health-analyzer-mcp = "health_analyzer.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/health_analyzer"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/health_analyzer",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
